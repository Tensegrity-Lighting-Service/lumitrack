name: CI

# Jusqu'ici pytest / cargo test / npm run build ne tournaient qu'en local,
# sur demande — aucune régression n'était détectée automatiquement à la
# pousse d'un commit. Trois jobs indépendants, un par langage du projet
# (core/ Python encore autoritaire, native/ Rust en cours de portage,
# frontend Tauri+React) : chacun échoue seul, sans bloquer les autres.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=src python -m pytest -q

  rust:
    name: Rust (cargo test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --all-targets

  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

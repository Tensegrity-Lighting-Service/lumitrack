[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumitrack"
version = "0.2.0"
description = "Choreography/prevvisualization editor (Tauri+React frontend) with timecode input and PosiStageNet output, Python core run as a local sidecar"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pypsn>=0.2.3",
    "websockets>=12.0",
]

[project.optional-dependencies]
midi = ["mido>=1.3", "python-rtmidi>=1.5"]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
lumitrack-sidecar = "lumitrack.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

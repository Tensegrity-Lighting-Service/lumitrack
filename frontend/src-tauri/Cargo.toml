[package]
name = "app"
# Version INTERNE du crate Rust — c'est elle que cargo affiche dans les
# logs de build ("Compiling app vX"), source de confusion (2026-08-07 :
# "il build une 0.1.0"). La VRAIE version de l'app vit dans
# tauri.conf.json ; celle-ci n'a aucun effet, alignée grossièrement.
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
# Vrais dialogues de fichiers (mission "navigateur plutot qu'un lien").
tauri-plugin-dialog = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-opener = "2.5.4"

# Instance unique (2026-08-06) : un second lancement rend la main a la
# fenetre deja ouverte au lieu de demarrer une deuxieme app (dont le
# sidecar echouerait de toute facon sur le port 17845 deja pris).
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10.1"

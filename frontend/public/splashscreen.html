<!doctype html>
<html lang="fr">
<!-- Splash screen (2026-08-06) : fenêtre Tauri dédiée "splashscreen",
     affichée pendant que la fenêtre principale (visible:false) attend le
     démarrage du sidecar et le premier écho projet. Fermée par App.tsx dès
     que l'app est prête. Page 100 % statique servie depuis public/ (Vite la
     copie telle quelle dans dist/) : aucune dépendance, aucune API Tauri —
     la progression est une animation d'attente, pas une vraie mesure. -->
<head>
  <meta charset="utf-8" />
  <title>Lumitrack</title>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden; user-select: none;
      background: #12141a; color: #e8e8ec;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    body {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px;
      border: 1px solid #2b2f38; box-sizing: border-box;
    }
    img { width: 72px; height: 72px; -webkit-user-drag: none; }
    .name { font-size: 20px; font-weight: 600; letter-spacing: 0.04em; }
    .status { font-size: 11px; color: #7a8093; }
    .bar {
      width: 240px; height: 4px; border-radius: 2px;
      background: #23262f; overflow: hidden;
    }
    .bar > div {
      height: 100%; width: 0%; border-radius: 2px; background: #4f6df5;
      animation: fill 6s cubic-bezier(0.15, 0.6, 0.3, 1) forwards;
    }
    /* Remplit vite au début puis ralentit vers 92 % — ne prétend jamais
       avoir fini : c'est la fermeture de la fenêtre qui signale "prêt". */
    @keyframes fill { 0% { width: 0%; } 100% { width: 92%; } }
  </style>
</head>
<body>
  <img src="/splash-icon.png" alt="" />
  <div class="name">Lumitrack</div>
  <div class="bar"><div></div></div>
  <div class="status" id="status">Démarrage du moteur…</div>
  <script>
    // Messages d'attente échelonnés, purement cosmétiques.
    const steps = [
      [2000, 'Connexion au moteur…'],
      [4000, 'Chargement du projet…'],
      [8000, 'Toujours en cours… (premier lancement plus long)'],
    ]
    for (const [ms, txt] of steps) {
      setTimeout(() => { document.getElementById('status').textContent = txt }, ms)
    }
  </script>
</body>
</html>
